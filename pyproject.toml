[project]
name = "academicomnisearch"
version = "0.1.0"
description = "Coletor automatizado e extrator de metadados para produção científica em larga escala com interface web interativa."
readme = "README.md"
authors = [
    { name = "Bernardo", email = "Bernardonogueira8@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.17.0",
    "fastapi>=0.162.2",
    "openpyxl>=3.1.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn>=0.30.0",
]
